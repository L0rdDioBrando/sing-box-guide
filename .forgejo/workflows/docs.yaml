name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.forgejo/workflows/docs.yaml'
      - 'book.toml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: https://github.com/peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build the book
        working-directory: .
        run: git pull && mdbook build
