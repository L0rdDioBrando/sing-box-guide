name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '.forgejo/workflows/docs.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mdBook
        uses: https://github.com/peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Build the book
        run: mdbook build /home/bopsifox/sing-box-guide
